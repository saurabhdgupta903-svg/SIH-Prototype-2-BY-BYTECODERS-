databases:
  - name: foodloop-db
    databaseName: foodloop_db
    user: foodloop
    plan: free
    region: singapore

services:
  - type: web
    name: foodloop-api
    runtime: python
    rootDir: api
    region: singapore
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foodloop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000"
      - key: OPEN_METEO_BASE_URL
        value: "https://api.open-meteo.com/v1"
      - key: OPEN_METEO_AIR_QUALITY_URL
        value: "https://air-quality-api.open-meteo.com/v1"
      - key: OSRM_BASE_URL
        value: "https://router.project-osrm.org"
      - key: NOMINATIM_BASE_URL
        value: "https://nominatim.openstreetmap.org"
      - key: OVERPASS_API_URL
        value: "https://overpass-api.de/api/interpreter"
      - key: INDIA_GRID_EMISSION_FACTOR
        value: "0.716"
      - key: FOOD_WASTE_EMISSION_FACTOR
        value: "2.5"
      - key: FOOD_WASTE_WATER_FACTOR
        value: "1000.0"
      - key: DEMO_INSTITUTION_LAT
        value: "18.5204"
      - key: DEMO_INSTITUTION_LNG
        value: "73.8567"
      - key: DEMO_INSTITUTION_CITY
        value: "Pune"
      - key: DEMO_INSTITUTION_STATE
        value: "Maharashtra"
      - key: CALENDARIFIC_API_KEY
        sync: false
      - key: ELECTRICITY_MAPS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
