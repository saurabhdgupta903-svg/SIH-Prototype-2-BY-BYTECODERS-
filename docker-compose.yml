version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: foodloop_db
    environment:
      POSTGRES_USER: foodloop
      POSTGRES_PASSWORD: foodloop123
      POSTGRES_DB: foodloop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodloop -d foodloop_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: foodloop_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://foodloop:foodloop123@db:5432/foodloop_db
      - SECRET_KEY=${SECRET_KEY:-foodloop-mofpi-secret-key-development-only}
      - OPEN_METEO_BASE_URL=https://api.open-meteo.com/v1
      - OSRM_BASE_URL=https://router.project-osrm.org
      - NOMINATIM_BASE_URL=https://nominatim.openstreetmap.org
      - OVERPASS_API_URL=https://overpass-api.de/api/interpreter
      - INDIA_GRID_EMISSION_FACTOR=0.716
      - FOOD_WASTE_EMISSION_FACTOR=2.5
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: foodloop_web
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
